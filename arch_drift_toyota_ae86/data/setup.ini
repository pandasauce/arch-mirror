TAB=ALIGNMENT FRONT
NAME=Ackerman
LUT=setup_front_ackerman.lut
DEFAULT=0
POS_X=0.5
POS_Y=5
HELP="Controls differential steering of the wheels. Positive means the inside wheel steers more, negative means the outside wheel steers more.\nA rough guideline is that positive increases understeer and negative decreases understeer.\nReal effects are more complicated and no perfect solution exists for all cars and corners.\nCan be used to tune the magnitude of yaw rate on turn-in compared to mid-corner and exit, and to tune the difference between low and high speed corners."

